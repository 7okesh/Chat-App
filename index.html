<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitChat - Real-time Socket.IO Chat App</title>
    <link rel="icon" type="image/png" href="chat.png">
    
    <!-- Primary Socket.IO client script (served by Express server) with CDN fallback -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"><\/script>');
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <img class="logo" src="chat.png" alt="ChitChat Logo">
            <div class="title-group">
                <h1>ChitChat</h1>
                <p class="subtitle">Real-time messaging</p>
            </div>
        </div>

        <div class="nav-right">
            <!-- Connection Status -->
            <div id="connection-badge" class="badge badge-connecting" title="Connection status">
                <span class="status-dot"></span>
                <span id="connection-status">Connecting...</span>
            </div>

            <!-- Online Users Counter -->
            <div class="badge badge-users" title="Online participants">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span id="online-count">0</span>
            </div>

            <!-- Sound Toggle Button -->
            <button id="sound-toggle" class="icon-btn" title="Toggle message sound" aria-label="Toggle sound">
                <span id="sound-icon">🔊</span>
            </button>
        </div>
    </nav>

    <!-- Main Chat Window -->
    <main class="chat-wrapper">
        <div class="container" id="message-container">
            <!-- Welcome placeholder shown before messages start -->
            <div class="chat-placeholder" id="chat-placeholder">
                <div class="placeholder-icon">💬</div>
                <h3>Welcome to ChitChat!</h3>
                <p>Messages will appear here in real time. Invite someone to join this URL and start chatting!</p>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="typing-text">Someone is typing</span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Message Send Form -->
        <div class="send">
            <form action="#" id="send-container">
                <input 
                    type="text" 
                    name="messageInp" 
                    id="messageInp" 
                    placeholder="Type a message..." 
                    autocomplete="off"
                    maxlength="2000"
                >
                <button class="btn" type="submit" id="send-btn" title="Send message" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Send</span>
                </button>
            </form>
        </div>
    </main>

    <!-- User Join Modal Dialog -->
    <div id="join-modal" class="modal-overlay">
        <div class="modal-card">
            <img class="modal-logo" src="chat.png" alt="ChitChat">
            <h2>Welcome to ChitChat</h2>
            <p>Enter your display name to start chatting with others in real time.</p>
            <form id="join-form">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="username-inp" 
                        placeholder="Enter your name (e.g. Alex)" 
                        maxlength="30" 
                        required 
                        autofocus
                    >
                </div>
                <button type="submit" class="join-btn">Join Chat</button>
            </form>
        </div>
    </div>

    <script defer src="js/client.js"></script>
</body>
</html>
