name: Node.js CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Verify server startup and health endpoint
      run: npm test

    - name: Trigger Render Deploy Hook (on push to main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          echo "Triggering Render re-deployment via Deploy Hook..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render redeploy request dispatched successfully!"
        else
          echo "Render automatically deploys on every git push via GitHub repo connection."
        fi
